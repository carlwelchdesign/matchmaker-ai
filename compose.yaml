name: argent

x-application-security: &application-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - argent-internal

x-application-build: &application-build
  context: .
  dockerfile: infra/docker/Dockerfile

services:
  web:
    <<: *application-security
    build:
      <<: *application-build
      target: web
    environment:
      APP_VERSION: ${APP_VERSION:-0.0.0-local}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  admin:
    <<: *application-security
    build:
      <<: *application-build
      target: admin
    environment:
      APP_VERSION: ${APP_VERSION:-0.0.0-local}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3002}:3002"
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3002').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    <<: *application-security
    build:
      <<: *application-build
      target: api
    environment:
      APP_VERSION: ${APP_VERSION:-0.0.0-local}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    <<: *application-security
    build:
      <<: *application-build
      target: worker
    environment:
      APP_VERSION: ${APP_VERSION:-0.0.0-local}
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "process.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argent}
      POSTGRES_USER: ${POSTGRES_USER:-argent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argent-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - argent-internal

  redis:
    image: redis:8.6.1-alpine@sha256:2afba59292f25f5d1af200496db41bea2c6c816b059f57ae74703a50a03a27d0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - argent-internal

networks:
  argent-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

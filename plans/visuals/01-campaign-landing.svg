  <text x="78" y="154" fill="#9A7A44" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.5">A CONTROLLED ARGENT CAMPAIGN</text>
  <text x="78" y="205" fill="#17231F" font-family="Georgia, serif" font-size="19">Montecito Matchmaker</text>

  <text x="78" y="300" fill="#17231F" font-family="Georgia, serif" font-size="66">A private search for</text>
  <text x="78" y="375" fill="#17231F" font-family="Georgia, serif" font-size="66">exceptional people.</text>
  <text x="80" y="433" fill="#5F6964" font-family="Arial, sans-serif" font-size="18">Argent is thoughtfully building a select candidate network</text>
  <text x="80" y="462" fill="#5F6964" font-family="Arial, sans-serif" font-size="18">in Santa Barbara County. Anyone may apply. Every profile</text>
  <text x="80" y="491" fill="#5F6964" font-family="Arial, sans-serif" font-size="18">is reviewed personally by our matchmaking team.</text>

  <rect x="78" y="548" width="216" height="54" rx="27" fill="#1E3A32"/>
  <text x="186" y="581" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" letter-spacing=".8">APPLY FOR CONSIDERATION</text>
  <text x="328" y="580" fill="#263A33" font-family="Arial, sans-serif" font-size="13" text-decoration="underline">What to expect</text>

  <rect x="78" y="698" width="522" height="145" rx="14" fill="#E9E3D8"/>
  <circle cx="124" cy="742" r="21" fill="#1E3A32"/>
  <path d="M115 742l6 6 13-15" fill="none" stroke="#FFF" stroke-width="2.3"/>
  <text x="158" y="736" fill="#17231F" font-family="Georgia, serif" font-size="20">Discreet by design</text>
  <text x="158" y="768" fill="#65706A" font-family="Arial, sans-serif" font-size="14">Profiles are never publicly browsable. Information is</text>
  <text x="158" y="791" fill="#65706A" font-family="Arial, sans-serif" font-size="14">shared only through a considered, permissioned process.</text>


  <text x="255" y="56" fill="#87908A" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">MATCHMAKING</text>
  <text x="1055" y="55" fill="#37443F" font-family="Arial, sans-serif" font-size="13">How it works</text>
  <text x="1170" y="55" fill="#37443F" font-family="Arial, sans-serif" font-size="13">Privacy</text>
